<!DOCTYPE html>

<head>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
               font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; text-align: center; }
        main { max-width: 520px; }
        img { width: 96px; height: 96px; margin-bottom: 20px; }
        h1 { font-size: 1.75rem; margin-bottom: 8px; }
        p { color: var(--muted); margin-bottom: 24px; }
        a.btn { display: inline-block; padding: 12px 24px; border-radius: 999px; background: var(--primary); color: #003640;
                font-weight: 600; text-decoration: none; }
        a.link { color: var(--primary); }
        nav { margin-top: 28px; font-size: 0.9rem; }
        nav a { color: var(--muted); margin: 0 8px; }
    </style>
</head>
